        <figure class="reveal">

        </figure>
        <figure class="reveal">
          <img src="movies/Web_Evolution.gif" alt="Evolution of the Lyman-alpha surface brightness profile with redshift">
          <figcaption>Evolution of the median Ly&alpha; surface-brightness profile around quasars at different redshifts. The surface brightness is corrected for redshift dimming, and the projected distance is normalized by the virial radius of a 10<sup>12.5</sup>M<sub>&#9737;</sub> dark matter halo.</figcaption>
        </figure>
        <figure class="reveal">
          <video src="movies/Web_P308m21.mp4" poster="movies/Web_P308m21.jpg" autoplay loop muted playsinline aria-label="3D view of the Lyman-alpha emission around the quasar P308-21"></video>
          <figcaption>3D distribution of the Ly&alpha; emission around the quasar P308&minus;21 at <i>z</i>&asymp;6.23. The gas appears to move rather quiescently, suggesting that it lies within the dark matter halo that hosts the quasar.</figcaption>
        </figure>
        <figure class="reveal">
          <video src="https://cdn.eso.org/videos/hd_1080p25_screen/eso1921b.mp4" poster="images/Web_EsoMerger.jpg" controls preload="none" aria-label="3D visualization of the Lyman-alpha and [CII] emission around P308-21"></video>
          <figcaption>3D visualization of the Ly&alpha; (blue) and [CII] (orange) emission around the quasar P308&minus;21. See our <a href="https://www.eso.org/public/news/eso1921/">ESO press release</a> for details. Credit: ESO/Farina et al.; ALMA (ESO/NAOJ/NRAO), Decarli et al.; L. Cal&ccedil;ada.</figcaption>
